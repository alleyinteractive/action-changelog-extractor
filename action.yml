name: 'Changelog Extractor'
description: 'Parse and extract structured information from Keep a Changelog formatted changelogs'
author: 'Alley Interactive'

branding:
  icon: 'file-text'
  color: 'blue'

inputs:
  changelog-path:
    description: 'Path to the changelog file'
    required: false
    default: 'CHANGELOG.md'
  version:
    description: 'Specific version to extract (e.g., "1.14.0" or "v1.14.0"). Leave empty to return all versions.'
    required: false

outputs:
  result:
    description: 'JSON array of parsed changelog entries'
    value: ${{ steps.changelog-extractor.outputs.result }}

# runs:
#   using: 'node24'
#   main: 'src/index.js'

runs:
  using: 'composite'
  steps:
    - name: Get WordPress Versions
      id: changelog-extractor
      uses: actions/github-script@v7
      with:
        script: |
          const run = require('${{github.action_path}}/src/index.js');
          await run(core);